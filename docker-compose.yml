services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: onfood-postgres:latest
    container_name: onfood-postgres
    restart: always
    environment:
      POSTGRES_USER: BUVVA
      POSTGRES_PASSWORD: BUVA@KR
      POSTGRES_DB: onfood
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U BUVVA -d onfood"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: onfood-backend:latest
    container_name: onfood-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://BUVVA:BUVA%40KR@db:5432/onfood
      - ENVIRONMENT=production
      - ENABLE_DOCS=false
      - WEB_CONCURRENCY=4
    volumes:
      - ./logs:/app/logs
      - ./app/static:/app/app/static
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  postgres_data:
